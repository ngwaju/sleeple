name: Deploy Vite app to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch is master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        env:
          DEPLOY_TARGET: github-pages
          # Public (publishable) values; safe to ship in the browser bundle.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://mbixqpqupmxxkghhtraf.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_sBy9K_hlROIp0DmrknV-yw_Aj3_8hH3' }}
          VITE_SUPABASE_PROJECT_ID: mbixqpqupmxxkghhtraf
        run: bun run build

      # Outside Lovable the static site lands in .output/public; inside Lovable it's dist/client.
      - name: Locate static site folder
        id: site
        run: |
          if [ -f .output/public/index.html ]; then dir=.output/public
          elif [ -f dist/client/index.html ]; then dir=dist/client
          else echo "No built index.html found"; ls -la . .output dist 2>/dev/null; exit 1; fi
          touch "$dir/.nojekyll"
          # SPA fallback so sign-in returns and deep links don't 404.
          cp "$dir/index.html" "$dir/404.html"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
